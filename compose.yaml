name: ai-agent-lab
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:18762:5432'
    volumes:
      - lab-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U lab -d lab']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20m
volumes:
  lab-data:
